name: CI

on:
  push:
  pull_request:

jobs:
  release-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run test
      - run: npm run check
      - run: npm run package
      - run: node scripts/validate-npm-pack.mjs
      - run: npm run package-computer-use-rc
      - uses: actions/upload-artifact@v4
        with:
          name: kv-computer-use-runtime-rc
          path: release/kv-computer-use-runtime-rc-v*/
          if-no-files-found: error
          retention-days: 14
